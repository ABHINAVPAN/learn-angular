<div style="border: 2px dashed #007bff; padding: 15px; border-radius: 8px; margin-top: 15px;">
  <h3>🧒 Child Component: Tax Calculator</h3>
  <p><strong>Gross Income Received from Parent:</strong> ₹{{ grossIncome | number:'1.2-2' }}</p>
  
  <div style="background: #f8f9fa; padding: 10px; border-radius: 4px;">
    <p>Estimated Tax (20%): <strong>₹{{ calculatedTax | number:'1.2-2' }}</strong></p>
    <p>Estimated Net Income: <strong>₹{{ netIncome | number:'1.2-2' }}</strong></p>
  </div>

  <button (click)="submitTaxSummary()" style="margin-top: 10px; padding: 8px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
    Send Summary to Parent Dashboard
  </button>
</div>
