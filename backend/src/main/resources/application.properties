server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/app_user?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:learn-angular-development-secret-key-change-before-production-2026}
app.jwt.expiration-ms=3600000
