<main class="auth-page">
  <section class="auth-panel">
    <p class="eyebrow">EMPLOYEE PORTAL</p>
    <h1>{{ mode === 'login' ? 'Welcome back' : 'Create account' }}</h1>
    <p class="intro">{{ mode === 'login' ? 'Sign in to manage employees.' : 'Create a new account.' }}</p>

    <form #authForm="ngForm" (ngSubmit)="submit()">
      <label>
        <span>Email</span>
        <input name="email" [(ngModel)]="form.email" required email type="email" />
      </label>

      <label>
        <span>Password</span>
        <input name="password" [(ngModel)]="form.password" required minlength="8" type="password" />
      </label>

      @if (errorMessage) {
        <p class="error-message" role="alert">{{ errorMessage }}</p>
      }

      <button type="submit" [disabled]="authForm.invalid || isSubmitting">
        {{ isSubmitting ? 'Please wait…' : mode === 'login' ? 'Login' : 'Register' }}
      </button>
    </form>

    <p class="toggle">
      {{ mode === 'login' ? 'New here?' : 'Already have an account?' }}
      <button type="button" (click)="mode = mode === 'login' ? 'register' : 'login'; errorMessage = ''">
        {{ mode === 'login' ? 'Create account' : 'Login' }}
      </button>
    </p>
  </section>
</main>
